<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1b7a3d" />
  <title>ゴルフ チーム戦スコア計算</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>⛳ ゴルフ チーム戦</h1>
    <p class="subtitle">グロス順位＋ネット順位の合算で総合優勝を決めるローカルアプリ</p>
  </header>

  <main>
    <!-- 大会情報 -->
    <section class="card">
      <h2>大会情報</h2>
      <div class="event-fields">
        <label>大会名
          <input type="text" id="eventName" placeholder="例：第3回 春季コンペ" />
        </label>
        <label>開催日
          <input type="date" id="eventDate" />
        </label>
        <label>コース
          <input type="text" id="courseName" placeholder="例：〇〇カントリークラブ" />
        </label>
      </div>
    </section>

    <!-- チーム編集 -->
    <section class="card">
      <div class="section-head">
        <h2>チーム・メンバー</h2>
        <button class="btn primary" id="addTeamBtn">＋ チームを追加</button>
      </div>
      <p class="hint">各プレイヤーの「グロス（合計打数）」と「ハンディ」を入力してください。ネット＝グロス−ハンディで自動計算します。</p>
      <div id="teamsContainer"></div>
    </section>

    <!-- 結果 -->
    <section class="card">
      <h2>集計結果</h2>
      <p class="hint">
        勝敗ルール：<strong>グロス合計の順位</strong>と<strong>ネット合計の順位</strong>を足し、
        <strong>合算が最小のチームが総合優勝</strong>です（合算が同じ場合はネット合計が少ない方が上位）。
      </p>
      <div id="resultsContainer"></div>
    </section>

    <!-- ツール -->
    <section class="card tools">
      <h2>ツール</h2>
      <div class="tool-buttons">
        <button class="btn" id="sampleBtn">サンプルデータを入れる</button>
        <button class="btn" id="exportBtn">JSON書き出し</button>
        <button class="btn" id="importBtn">JSON読み込み</button>
        <button class="btn danger" id="resetBtn">全消去</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
      <p class="hint">データはこの端末のブラウザ内（localStorage）に自動保存されます。通信は行いません。</p>
    </section>
  </main>

  <footer class="app-footer">
    <span id="saveStatus">自動保存: 準備中</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
